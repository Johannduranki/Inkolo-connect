# Include inside the frontend Apache VirtualHost, not in the document root.
# Requires mod_rewrite, mod_proxy, mod_proxy_http and mod_headers.
# The frontend and backend containers must share their existing Docker network.
ProxyRequests Off
ProxyPreserveHost On
RewriteEngine On

# API errors must remain API errors; never return Angular HTML for these paths.
RewriteRule ^/?(api(?:/.*)?|uploads(?:/.*)?)$ http://backend:3001/$1 [P,L]
RewriteRule ^/?(two-factor|join-community|payments/cycle|heritage-cytoscape\.js)$ http://backend:3001/$1 [P,L]
RewriteRule ^/?(dashboard/(?:wholesaler-orders|community-reports|service-pricing|trader-training|branding|heritage|treasury|users|tenant|cycle)|dashboard/services/[^/]+)$ http://backend:3001/$1 [P,L]
ProxyPassReverse / http://backend:3001/

<Directory "/usr/local/apache2/htdocs">
    Require all granted
    Options -Indexes
    AllowOverride None
    FallbackResource /index.html
    <FilesMatch "\.(html|js|css)$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
