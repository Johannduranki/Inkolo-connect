# Operator-managed include INSIDE the existing application server block.
# Replace its existing /api/ location; do not add a duplicate location.
# Verify this container name and shared network against the live server first.
location ^~ /api/ {
    # No URI suffix: retain /api/auth/login, not /auth/login.
    proxy_pass http://durankidemo_backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_intercept_errors off;
    proxy_cache off;
}
