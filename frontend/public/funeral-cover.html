<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funeral cover configuration | Duranki</title><link rel="stylesheet" href="/funeral-cover.css"></head>
<body><header><img src="/duranki-up-logo.png" alt="Duranki"><nav aria-label="Workspace"><a href="/dashboard/platform-admin">Platform Admin</a><a href="/dashboard/service-pricing">Service configuration</a></nav></header>
<main><p class="breadcrumb">Duranki / Service configuration / Funeral cover</p><div class="heading"><h1>Funeral cover</h1><button id="reload" type="button">Reload</button></div><p id="status" role="status">Loading configuration...</p>
<form id="config" hidden><section class="branding"><div><h2>Cover identity</h2><label>Funeral cover name<input id="name" maxlength="100" required></label><label>Upload logo<input id="logo" type="file" accept="image/png,image/jpeg"></label><small>PNG or JPG, up to 2 MB.</small><button id="remove-logo" type="button">Remove logo</button></div><img id="preview" src="/service-funeral-general.png" alt="Funeral cover logo"></section>
<section><div class="heading"><h2>Monthly cover plans</h2><button id="add" type="button">Add plan</button></div><div id="plans"></div></section><footer><p>Configuration only. Existing cover, premiums and payments remain unchanged.</p><button id="save" type="submit">Save configuration</button></footer></form></main><script src="/funeral-cover.js" defer></script><script type="module" src="/language-page.js"></script></body></html>
