<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community reports | Duranki</title><link rel="stylesheet" href="/community-reports.css"></head>
<body><header><img src="/duranki-up-logo.png" alt="Duranki"><strong>Community reports</strong><nav><a href="/dashboard/platform-admin">Platform Admin</a><a href="/dashboard/tenant">Tenant workspace</a></nav></header>
<main><h1>Community reports</h1><form id="filters"><label>Community<select id="community" required></select></label><label>Payments from<input id="from" type="date" value="2000-01-01" required></label><label>Payments to<input id="to" type="date" required></label><button>Refresh report</button></form>
<p id="notice" role="status">Loading communities...</p><div id="report" hidden><p id="generated"></p><dl id="summary"></dl><h2>Payment records</h2><div id="totals"></div><button id="export-payments" type="button">Download payments CSV</button><div class="table-wrap"><table><thead><tr><th>Member ID</th><th>Source</th><th>Status</th><th>Amount</th><th>Date</th><th>Reference</th></tr></thead><tbody id="payments"></tbody></table></div>
<h2>Members and services</h2><div class="actions"><label>Search member<input id="search" type="search"></label><label>Service status<select id="status"><option value="">All statuses</option><option>active</option><option>terminated</option><option>suspended</option><option>cancelled</option></select></label><button id="export-members" type="button">Download members CSV</button></div><p id="count"></p><div class="table-wrap"><table><thead><tr><th>Member</th><th>Member ID</th><th>Account</th><th>Service</th><th>Service status</th><th>Reason</th><th>Contribution</th><th>Billing cycle</th></tr></thead><tbody id="members"></tbody></table></div><h2>Reporting coverage</h2><ul id="notes"></ul></div></main><script src="/community-reports.js" defer></script></body></html>
